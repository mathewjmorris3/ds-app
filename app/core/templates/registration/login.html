{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login | DS Business Management</title>

<link
    rel="stylesheet"
    href="{% static 'core/app.css' %}"
>

</head>


<body>

<div class="login-page">

<div class="login-card">

<div class="login-logo">
DS
</div>

<h1>Welcome Back</h1>

<p>
Sign in to DS Business Management.
</p>


{% if form.errors %}

<div class="message error">
Incorrect username or password.
</div>

{% endif %}


<form method="post">

{% csrf_token %}

<div class="form-group">

<label for="id_username">
Username
</label>

{{ form.username }}

</div>


<div class="form-group">

<label for="id_password">
Password
</label>

{{ form.password }}

</div>


<button
    class="button button-primary button-block"
    type="submit"
>
Sign In
</button>


{% if next %}

<input
    type="hidden"
    name="next"
    value="{{ next }}"
>

{% endif %}

</form>

</div>

</div>

</body>

</html>
